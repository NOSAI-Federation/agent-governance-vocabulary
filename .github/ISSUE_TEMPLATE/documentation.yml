name: Documentation problem
description: Something in the README, the contribution guide, the matrix page or another document is wrong or unclear.
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
